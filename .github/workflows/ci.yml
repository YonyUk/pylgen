name: CI

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-22.04, windows-latest, macos-latest]
        python-version: [ "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Clean previous build (Linux/macOS)
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: |
          python setup.py clean --all || true
          rm -rf build/*.so *.c
          rm -rf build*.egg-info
      
      - name: Clean previous build (Windows)
        if: runner.os == 'Windows'
        run: |
          python setup.py clean --all || true
          Remove-Item -Recurse -Force build -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force *.egg-info -ErrorAction SilentlyContinue
          Get-ChildItem -Recurse -Filter *.pyd | Remove-Item -Force -ErrorAction SilentlyContinue
        shell: pwsh
      
      - name: Build extensions
        run: |
          python setup.py build_ext --inplace --force


      - name: Run tests
        run: |
          python -m pytest tests
  
  build_wheels:
    name: Build wheels
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            archs: "auto64"
          - os: windows-latest
            archs: "auto64"
          - os: macos-latest
            archs: "x86_64 arm64"
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install build dependencies
        uses: pypa/cibuildwheel@v3.3.1
        env:
          CIBW_BUILD: "cp312-* cp313-* cp314-*"
          CIBW_ARCHS: ${{ matrix.archs }}
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux2014
          
      - name: Save wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: wheelhouse/*.whl
  
  test_wheels:
    name: Test wheels (${{ matrix.os }}, ${{ matrix.python-version }})
    needs: build_wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04, windows-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14"]
    
    steps:

      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          name: wheels
          path: wheelhouse
      
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      
      - name: Purge any editable install
        run: |
          python -m pip uninstall -y pylgen pylgen-core || true
          python -m pip cache purge

      - name: Install build wheel
        run: |
          python -m pip install --no-deps --force-reinstall --find-links=wheelhouse pylgen-core
      
      - name: Remove source tree (force import from installed wheel)
        shell: bash
        run: |
          set -euo pipefail
          # Ajusta a tu layout real; el comando debe encontrar el directorio
          find . -maxdepth 3 -type d -name pylgen -print
          rm -rf ./pylgen
          rm -rf ./src/pylgen
          # Verifica que ya no está
          if [ -d ./pylgen ] || [ -d ./src/pylgen ]; then
            echo "ERROR: no se pudo borrar el arbol fuente" >&2
            exit 1
          fi
      
      - name: Verify import comes from site-packages
        shell: bash
        run: |
          python - <<'EOF'
          import importlib, inspect, sys
          mod = importlib.import_module("pylgen")
          path = inspect.getfile(mod)
          print("Imported from:", path)
      
      - name: Run tests against installed wheel
        run: |
          python -m pytest tests