name: CI

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test,cython]
          pip install coverage-cython  # opcional, pero útil
      
      - name: Run tests with coverage
        env:
          CYTHON_TRACE: 1
          COVERAGE_PROCESS_START: .coveragerc
        run: |
          coverage run -m pytest
          coverage xml -o coverage.xml
      
      - name: Check coverage XML for pyx files
        run: |
          echo "Looking for .pyx files in coverage.xml..."
          grep -c "pyx" coverage.xml || echo "No pyx files found"
          head -n 50 coverage.xml
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          verbose: true
          fail_ci_if_error: false