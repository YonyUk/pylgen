[build-system]
requires = ["setuptools>=61", "wheel", "cython"]
build-backend = "setuptools.build_meta"

[project]
name = "pylgen-core"
version = "0.5.6"
description = "From prototype to production: a Python-native compiler framework that brings the Dragon Book to life in Python, with clarity throughout."
readme = "readme.md"
authors = [
    {name = "YonyUk", email = "yonatanjoseguerraperez@gmail.com"}
]
license = {file = "LICENSE"}
requires-python = ">=3.12"
dependencies = [
    "colorama==0.4.6",
    "decorator==5.2.1",
    "Jinja2==3.1.6",
    "jsonpickle==4.1.1",
    "packaging==26.2",
    "pyparsing==3.3.2",
    "PyYAML==6.0.3",
]

keywords = ["parser", "lalr", "lexer", "compiler", "grammar", "attributed-grammar", "automaton", "regex", "language-tool", "pylgen", "visualization", "high-performs"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Compilers",
    "Topic :: Text Processing :: Linguistic",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only"
]

[project.optional-dependencies]
visual = [
    "matplotlib==3.10.9",
    "networkx==3.6.1",
    "pyvis==0.3.2",
]
cython = [
    "build==1.5.0",
    "Cython==3.2.4",
    "setuptools==82.0.1",
    "wheel==0.47.0",
]
test = [
    "pytest==9.0.3",
]
all = [
    "colorama==0.4.6",
    "decorator==5.2.1",
    "Jinja2==3.1.6",
    "jsonpickle==4.1.1",
    "packaging==26.2",
    "pyparsing==3.3.2",
    "PyYAML==6.0.3",
    "matplotlib==3.10.9",
    "networkx==3.6.1",
    "pyvis==0.3.2",
    "build==1.5.0",
    "Cython==3.2.4",
    "setuptools==82.0.1",
    "wheel==0.47.0",
    "pytest==9.0.3",
]

[project.urls]
"Homepage" = "https://github.com/yonyuk/pylgen"
"Repository" = "https://github.com/yonyuk/pylgen"
"Bug Tracker" = "https://github.com/yonyuk/pylgen/issues"
"Documentation" = "https://pylgen.readthedocs.io/"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
where = ["."]
include = ["pylgen*"]
exclude = ["tests*", "docs*"]

[tool.setuptools.package-data]
pylgen = ["*.pyx", "*.c", "*.pxd"]