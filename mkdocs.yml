site_name: PyLGEN
site_url: https://pylgen.readthedocs.io/en/latest/

nav:
  - Overview: index.md
  - First Steps:
    - Table of Contents: getting-started/table_of_contents.md
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quick-start.md
    - Key Concepts: getting-started/key-concepts.md
    - Next Steps: getting-started/next-steps.md

theme:
  name: material
  custom_dir: docs/mkdocs_extras/overrides
  features:
    - navigation.indexes
    - navigation.sections
    - toc.integrate
    - navigation.footer
    - content.code.copy

  palette:
    
    - scheme: default
      primary: 'teal'
      accent: 'amber'
      toggle:
        icon: material/brightness-7
        name: dark mode

    - scheme: slate
      primary: 'teal'
      accent: 'amber'
      toggle:
        icon: material/brightness-4
        name: light mode

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.highlight:
        use_pygments: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tilde
  - pymdownx.arithmatex:
      generic: true

plugins:
  - search
  - gen-files:
      scripts:
        - docs/mkdocs_extras/hooks/group_by_sections.py
  - meta-descriptions:
      enable_checks: true
      min_length: 50
      max_length: 200
      trim: true

  - toc-md:
      toc_page_title: Table of Contents
      output_path: table_of_contents.md
      header_level: 5
      template_dir_path: docs/mkdocs_extras/templates
      overwrite: always 
      subdir_index_depth: 1
      output_root_index: false

hooks:
  - docs/mkdocs_extras/hooks/group_by_sections.py

extra_css:
    - mkdocs_extras/stylesheets/extra.css
    - https://unpkg.com/katex@0/dist/katex.min.css

extra_javascript:
  - mkdocs_extras/javascripts/katex.js
  - https://unpkg.com/katex@0/dist/katex.min.js
  - https://unpkg.com/katex@0/dist/contrib/auto-render.min.js